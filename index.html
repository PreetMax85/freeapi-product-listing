<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Explorer | FreeAPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .product-card {
            background: white;
            border: 1px solid #e5e5e5;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header & Search -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold mb-6 text-gray-900">Discover Products</h1>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="Search products..." 
                        class="w-full p-3 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900">
                    <span class="absolute left-3 top-3.5 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                </div>
            </div>
        </div>

        <!-- Category Filters -->
        <div id="categoryFilters" class="flex flex-wrap gap-2 mb-8">
            <button class="cat-btn px-4 py-2 rounded-full border border-gray-300 bg-white text-sm hover:bg-gray-100 transition" data-category="all">All</button>
            <!-- Dynamic categories will be injected here -->
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Skeletons initially or JS will inject here -->
        </div>

        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-12">
            <p class="text-xl text-gray-500">No products found matching your search.</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden text-center py-12">
            <p class="text-xl text-red-500 mb-4" id="errorMessage">Something went wrong.</p>
            <button id="retryBtn" class="bg-gray-900 text-white px-6 py-2 rounded-lg hover:bg-gray-800 transition">Retry</button>
        </div>

        <!-- Pagination -->
        <div class="mt-12 text-center">
            <button id="loadMoreBtn" class="hidden bg-white border border-gray-300 px-8 py-3 rounded-lg font-semibold hover:bg-gray-50 transition">
                Load More
            </button>
            <div id="loadingMoreIndicator" class="hidden text-gray-500">Loading more...</div>
        </div>
    </div>

    <!-- Skeleton Template -->
    <template id="skeletonTemplate">
        <div class="product-card rounded-lg overflow-hidden flex flex-col h-full">
            <div class="aspect-square skeleton w-full"></div>
            <div class="p-4 flex flex-col flex-grow">
                <div class="h-4 w-20 skeleton rounded mb-2"></div>
                <div class="h-6 w-full skeleton rounded mb-2"></div>
                <div class="h-4 w-3/4 skeleton rounded mb-4"></div>
                <div class="mt-auto">
                    <div class="h-6 w-24 skeleton rounded mb-4"></div>
                    <div class="h-10 w-full skeleton rounded"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
